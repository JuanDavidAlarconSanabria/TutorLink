[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: pruebas unitarias puras (sin BD, sin HTTP)
    integration: pruebas de integración del ORM contra una BD real
    acceptance: pruebas de aceptación de historias de usuario vía HTTP
addopts =
    -ra
    --strict-markers
    --cov=.
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
